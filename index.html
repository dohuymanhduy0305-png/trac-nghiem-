    <script>

        const QUESTIONS = [
            { q: "Triết học ra đời từ những nguồn gốc nào?", options: ["Nguồn gốc nhận thức và nguồn gốc kinh tế - xã hội.", "Nguồn gốc nhận thức và nguồn gốc xã hội.", "Nguồn gốc tâm lý và nguồn gốc tôn giáo.", "Nguồn gốc tâm lý và nguồn gốc nhận thức."], ans: 1 },
            { q: "Theo quan điểm của Triết học Mác - Lênin, nguồn gốc nhận thức dẫn đến sự ra đời của triết học là gì?", options: ["Khi xã hội loài người đã có sự phân chia giai cấp.", "Tư duy của con người đạt đến trình độ trừu tượng hóa và khái quát hóa về thế giới khách quan.", "Khi xã hội có sự phân chia giữa nông nghiệp và thủ công nghiệp.", "Khi xã hội có sự phân chia lao động giữa người giàu và người nghèo."], ans: 1 },
            { q: "Theo quan điểm của triết học Mác - Lênin, nguồn gốc xã hội cho sự ra đời của triết học là", options: ["loài người đã xuất hiện giai cấp, nhà nước.", "nền sản xuất xã hội đã có sự phân công lao động.", "lao động trí óc đã tách khỏi lao động chân tay.", "bao gồm tất cả các đáp án."], ans: 3 },
            { q: "Một trong những nguồn gốc xã hội cho sự ra đời của triết học là", options: ["nền sản xuất xã hội chưa có sự phân công lao động.", "lao động trí óc đã tách khỏi lao động chân tay.", "xã hội loài người chưa xuất hiện giai cấp, nhà nước.", "lao động cụ thể gắn liền với lao động trừu tượng."], ans: 1 },
            { q: "Một trong những nguồn gốc xã hội cho sự ra đời của triết học là", options: ["Xã hội loài người chưa xuất hiện giai cấp, nhà nước.", "Xã hội loài người xuất hiện giai cấp.", "Lao động cụ thể gắn liền với lao động trừu tượng.", "Lao động trí óc gắn liền với lao động chân tay."], ans: 1 },
            { q: "Ở Trung Quốc, thuật ngữ triết học được hiểu là gì?", options: ["Triết học là biểu hiện cao của trí tuệ, là sự hiểu biết sâu sắc của con người về toàn bộ thế giới.", "Triết học là sự chiêm ngưỡng thế giới.", "Triết học là yêu thích nghiên cứu.", "Triết học là giải thoát."], ans: 0 },
            { q: "Theo chủ nghĩa Mác - Lênin, triết học là gì?", options: ["Là hệ thống quan điểm lý luận chung nhất về thế giới và vị trícon người trong thế giới đó.", "Là khoa học về những quy luật vận động, phát triển chung nhất của tự nhiên.", "Là khoa học về những quy luật vận động, phát triển chung nhất của xã hội và tư duy.", "Bao gồm tất cả các đáp án."], ans: 0 },
            { q: "Trong lịch sử triết học, người đầu tiên xác lập đối tượng của triết học một cách hợp lý nhất là", options: ["C.Mác.", "Feuerbach.", "Hegel.", "Ph.Ăngghen."], ans: 0 },
            { q: "Đối tượng nghiên cứu của triết học ở phương Tây thời Trung cổ là gì?", options: ["Tập trung nghiên cứu các chủ đề như niềm tin tôn giáo, thiên đường, địa ngục.", "Về nghi thức và văn hóa, tư tưởng.", "Nghiên cứu về tự nhiên, xã hội.", "Nghiên cứu về lịch sử, văn hóa của nhân loại."], ans: 0 },
            { q: "Thế giới quan chung nhất, phổ biến nhất, được sử dụng trong mọi ngành khoa học và trong toàn bộ đời sống xã hội là", options: ["thế giới quan triết học.", "thế giới quan tôn giáo.", "thế giới quan khoa học.", "thế giới quan huyền thoại."], ans: 0 },
            { q: "Hạt nhân lý luận của thế giới quan theo quan điểm của triết học Mác - Lênin là gì?", options: ["Triết học.", "Văn hóa.", "Văn học.", "Giáo lý tôn giáo."], ans: 0 },
            { q: "Theo Ph.Ăngghen, vấn đề cơ bản lớn của mọi triết học, đặc biệt là của triết học hiện đại, là vấn đề quan hệ giữa những yếu tố nào?", options: ["Vật chất và vận động.", "Tư duy và tồn tại.", "Tư duy và nhận thức.", "Tư tưởng và hiện thực."], ans: 1 },
            { q: "Theo Triết học Mác - Lênin, vấn đề cơ bản của triết học là", options: ["Mối quan hệ giữa vật chất và không gian, thời gian.", "Mối quan hệ giữa ý thức và vận động.", "Mối quan hệ giữa vật chất và ý thức.", "Mối quan hệ giữa ý thức và không gian thời gian."], ans: 2 },
            { q: "Việc giải quyết vấn đề cơ bản của triết học có vai trò như thế nào đối với sự phân loại triết học?", options: ["Là cơ sở phê phán, bác bỏ chủ nghĩa duy tâm.", "Là bằng chứng đề cao chủ nghĩa duy vật.", "Là dự báo để xây dựng phương pháp luận và thế giới quan cho chủ nghĩa duy vật và chủ nghĩa duy tâm.", "Là tiêu chuẩn để xác định lập trường, thế giới quan của các triết gia và học thuyết của họ."], ans: 3 },
            { q: "Mặt thứ hai trong vấn đề cơ bản của triết học là", options: ["con người có khả năng nhận thức được thế giới hay không?", "thế giới vật chất có được sinh ra và mất đi hay không?", "vật chất và ý thức cái nào có trước, cái nào có sau?", "cuộc sống của con người sẽ đi về đâu?"], ans: 0 },
            { q: "Giải quyết mặt thứ nhất trong vấn đề cơ bản của triết học đã xác lập nên những trường phải lớn nào?", options: ["Chủ nghĩa duy vật siêu hình và chủ nghĩa duy vật biện chứng.", "Chủ nghĩa duy vật và chủ nghĩa duy tâm.", "Chủ nghĩa duy tâm và hoài nghi luận.", "Bất khả tri luận và khả trí luận."], ans: 1 },
            { q: "Theo quan điểm của Triết học Mác - Lênin, chủ nghĩa duy vật là", options: ["khuynh hướng triết học thừa nhận ý thức là tỉnh thứ nhất, vật chất là tính thứ hai.", "trường phái triết học thừa nhận bản nguyên của thế giới là vật chất, vật chất là tỉnh thứ nhất, ý thức là tính thứ hai, vật chất quyết định ý thức.", "khuynh hướng triết học xem vật chất và ý thức cùng tồn tại, chịu sự quy định từ hiện thực khách quan.", "trường phái triết học thừa nhận bản nguyên của thế giới là ý thức, ý thức quyết định vật chất."], ans: 1 },
            { q: "Chủ nghĩa duy vật có những hình thức cơ bản nào?", options: ["Chủ nghĩa duy vật chất phác, chủ nghĩa duy vật thời cổ đại, chủ nghĩa duy vật siêu hình.", "Chủ nghĩa duy vật chất phác, chủ nghĩa duy vật siêu hình, chủ nghĩa duy vật biện chứng.", "Chủ nghĩa duy vật siêu hình, chủ nghĩa duy vật thế kỷ XV- XVIII, chủ nghĩa duy vật trước C. Mác.", "Chủ nghĩa duy vật thời cổ đại, chủ nghĩa duy vật biện chứng, chủ nghĩa duy vật lịch sử."], ans: 1 },
            { q: "Hình thức đầu tiên của chủ nghĩa duy vật là", options: ["chủ nghĩa duy vật siêu hình.", "chủ nghĩa duy vật chất phác.", "chủ nghĩa duy vật biện chứng.", "chủ nghĩa duy vật thế kỷ XV – XVIII."], ans: 1 },
            { q: "Quan điểm triết học nào xem thế giới như một cỗ máy khổng lồ mà mỗi bộ phận tạo nên thế giới đó về cơ bản ở trong trạng thái biệt lập và tĩnh tại?", options: ["Chủ nghĩa duy tâm khách quan.", "Chủ nghĩa duy vật siêu hình.", "Chủ nghĩa duy vật chất phác.", "Chủ nghĩa duy vật biện chứng."], ans: 1 },
            { q: "Về tư tưởng, vai trò tích cực của chủ nghĩa duy vật siêu hình thể kỷ XV - XVIII là", options: ["triết học phục vụ giai cấp thống trị.", "tạo ra bước ngoặt cách mạng trong lịch sử triết học.", "chống lại thế giới quan duy tâm, tôn giáo.", "thời kỳ chuyển tiếp cho sự phát triển rực rỡ của khoa học."], ans: 2 },
            { q: "Hình thức phát triển cao nhất của chủ nghĩa duy vật là", options: ["chủ nghĩa duy vật chất phác.", "chủ nghĩa duy vật siêu hình.", "chủ nghĩa duy vật biện chứng.", "chủ nghĩa duy vật trước C.Mác."], ans: 2 },
            { q: "Theo quan điểm của Triết học Mác - Lênin, chủ nghĩa duy tâm là", options: ["khuynh hướng triết học thừa nhận vật chất là tính thứ nhất, ý thức là tính thứ hai, vật chất quyết định ý thức.", "khuynh hướng triết học thừa nhận vật chất và ý thức cùng tồn tại, chịu sự quy định từ hiện thực khách quan.", "trường phái triết học thừa nhận bản nguyên của thế giới là ý thức, ý thức là tính thứ nhất, vật chất là tính thứ hai, ý thức quyết định vật chất.", "trường phái triết học khẳng định cơ sở đầu tiên của mọi vật trong vũ trụ là vật chất."], ans: 2 },
            { q: "Chủ nghĩa duy tâm có những hình thức cơ bản nào?", options: ["Chủ nghĩa hoài nghi và thuyết bất khả tri.", "Chủ nghĩa duy danh và chủ nghĩa duy thực.", "Chủ nghĩa duy tâm khách quan và chủ nghĩa duy tâm chủ quan.", "Chủ nghĩa thực chứng và chủ nghĩa thực dụng."], ans: 2 },
            { q: "Khẳng định tỉnh thứ nhất của ý thức, chủ nghĩa duy tâm chủ quan coi ý thức là", options: ["ý niệm tuyệt đối.", "tinh thần thế giới.", "ý thức con người.", "ý thức thần thánh."], ans: 2 },
            { q: "Chủ nghĩa duy vật và chủ nghĩa duy tâm đối lập nhau về phương diện nào?", options: ["Phương pháp luận.", "Nhân sinh quan.", "Thế giới quan.", "Nhận thức luận."], ans: 2 },
            { q: "Nhà triết học nào thừa nhận vật chất và ý thức là hai bản nguyên song song cùng tồn tại, cùng quyết định nguồn gốc và sự vận động của thế giới?", options: ["Descartes.", "Democritos.- nguyên tử", "Plato.", "Newton."], ans: 0 },
            { q: "Trường phái triết học nào giải thích thế giới bằng cả hai bản nguyên vật chất và tinh thần cùng quyết định nguồn gốc và sự vận động của thế giới?", options: ["Nhị nguyên luận.", "Nhất nguyên luận duy tâm.", "Nhất nguyên luận – 1 trong 2", "Nhất nguyên luận duy vật."], ans: 0 },
            { q: "Giải quyết mặt thứ hai trong vấn đề cơ bản của triết học đã xác lập nên những trường phái lớn nào?", options: ["Khả trị luận và bất khả trị luận – mặt thứ hai - con người có nhận thức được hay không?", "Chủ nghĩa duy vật và chủ nghĩa duy tâm – mặt thứ nhất – Cái nào có trước?", "Chủ nghĩa duy tâm khách quan và chủ nghĩa duy tâm chủ quan.", "Chủ nghĩa duy thực và chủ nghĩa duy danh."], ans: 0 },
            { q: "Học thuyết triết học nào khẳng định con người có khả năng nhận thức được thế giới?", options: ["Học thuyết khả trị luận.", "Học thuyết bất khả trí luận.", "Học thuyết hoài nghi luận.", "Học thuyết nhị nguyên luận."], ans: 0 },
            { q: "Trường phái triết học nào thừa nhận sự tồn tại của các sự vật, hiện tượng của thế giới nhưng phủ nhận đặc trưng “tự thân tồn tại” của chúng?", options: ["Chủ nghĩa duy tâm.", "Chủ nghĩa duy vật.", "Chủ nghĩa duy vật siêu hình.", "Chủ nghĩa duy vật biện chứng."], ans: 0 },
            { q: "Điểm tương đồng của các quan niệm duy vật về vật chất thời cổ đại là", options: ["đồng nhất vật chất với vật thể.", "đồng nhất vật chất với giới tự nhiên.", "đồng nhất vật chất với hiện tượng siêu nhiên.", "đồng nhất vật chất với ý thức."], ans: 0 },
            { q: "Ưu điểm của các nhà triết học duy vật trước C.Mác là", options: ["thừa nhận sự tồn tại khách quan của thế giới vật chất, lấy bản thân giới tự nhiên để giải thích tự nhiên.", "thừa nhận sự tồn tại của các sự vật, hiện tượng của thế giới nhưng phủ nhận đặc trưng \"tự thân tồn tại” của chúng – CN duy tâm", "là cơ sở lý luận cho sự phát triển của khoa học tự nhiên.", "là cơ sở khoa học để giải thích và cải tạo thế giới."], ans: 0 },
            { q: "Nhà triết học nào cho rằng cơ sở đầu tiên của mọi vật trong vũ trụ là Apeirôn - một dạng vật chất đơn nhất, vô định, vô hạn và tồn tại vĩnh viễn?", options: ["Anaximander.", "Thales – nước", "Democritos – nguyên tử", "Heraclitus – lửa"], ans: 0 },

            { q: "Theo Triết học Mác - Lênin, hình thức cộng đồng người là", options: ["cách thức con người tiến hành quá trình sản xuất vật chất ở những giai đoạn lịch sử nhất định.", "toàn bộ những quan hệ sản xuất của một xã hội trong sự vận động hiện thực của chúng hợp thành cơ cấu kinh tế của xã hội đó.", "cách thức tổ chức xã hội của con người trong những thời kỳ lịch sử xã hội khác nhau.", "tổng hợp các quan hệ kinh tế - vật chất giữa người với người trong quá trình sản xuất vật chất."], ans: 2 },
            { q: "Các hình thức cộng đồng người từ thấp đến cao trong lịch sử phát triển của xã hội loài người cho đến nay là", options: ["thị tộc, bộ tộc, dân tộc và bộ lạc.", "bộ lạc, thị tộc, bộ tộc và dân tộc.", "thị tộc, bộ lạc, bộ tộc và dân tộc.", "thị tộc, bộ tộc, bộ lạc và dân tộc."], ans: 2 },
            { q: "Hình thức cộng đồng người sớm nhất của loài người là", options: ["bộ lạc.", "bộ tộc.", "thị tộc.", "dân tộc."], ans: 2 },
            { q: "Hình thức cộng đồng người phát triển từ thị tộc và do sự liên kết của nhiều thị tộc có cùng huyết thống tạo thành là", options: ["thị tộc.", "bộ tộc.", "bộ lạc.", "dân tộc."], ans: 1 },
            { q: "Hình thức cộng đồng người hình thành khi xã hội có sự phân chia thành giai cấp là", options: ["thị tộc.", "bộ lạc.", "bộ tộc.", "bào tộc."], ans: 2 },
            { q: "Hình thức cộng đồng người phát triển cao nhất từ trước đến nay là", options: ["thị tộc.", "bộ lạc.", "dân tộc.", "bộ tộc."], ans: 2 },
            { q: "Yếu tố đặc biệt quan trọng của sự liên kết cộng đồng dân tộc là", options: ["trình độ học vấn.", "màu da.", "văn hóa.", "địa vị kinh tế - xã hội."], ans: 2 },
            { q: "Giai cấp và dân tộc có mối quan hệ như thế nào?", options: ["Đấu tranh giải phóng dân tộc là điều kiện, tiền đề cho đấu tranh giải phóng giai cấp.", "Giai cấp quyết định dân tộc.", "Vấn đề dân tộc có ảnh hưởng quan trọng đến vấn đề giai cấp.", "Bao gồm tất cả các đáp án."], ans: 3 },
            { q: "Khái niệm nào dùng để chỉ toàn thể cộng đồng người sống trên Trái đất?", options: ["Nhân loại.", "Dân tộc.", "Thị tộc.", "Bộ tộc."], ans: 0 },
            { q: "Nhận định “Nhà nước là sản phẩm của một xã hội đã phát triển tới một giai đoạn nhất định\" được Ph.Ăngghen thể hiện trong tác phẩm nào?", options: ["Nguồn gốc của gia đình, của chế độ tư hữu và của nhà nước.", "Hệ tư tưởng Đức.", "Gia đình thần thánh.", "Tuyên ngôn của Đảng Cộng sản."], ans: 0 },
            { q: "Trong xã hội nguyên thủy, xã hội tồn tại theo thể chế nào sau đây?", options: ["Xã hội tồn tại theo chế độ cộng hòa.", "Xã hội tồn tại theo thể chế quân chủ.", "Xã hội tồn tại theo chế độ lập hiến.", "Xã hội tồn tại theo thể chế tự quản."], ans: 3 },
            { q: "Theo Triết học Mác - Lênin, nhà nước ra đời đáp ứng yêu cầu nào?", options: ["Duy trì trật tự và thống trị xã hội của giai cấp bị trị.", "Duy trì trật tự và thống trị xã hội của giai cấp không cơ bản.", "Duy trì trật tự và thống trị xã hội của giai cấp thống trị.", "Tất cả các đáp án đều đúng."], ans: 2 },
            { q: "Thuật ngữ triết học “Philosophia yêu mến sự thông thái” xuất hiện đầu tiên ở quốc gia nào?", options: ["Hy Lạp.", "La Mã.", "Ai Cập cổ đại.", "Ấn Độ cổ đại."], ans: 0 },
            { q: "Trong thế giới quan tôn giáo, yếu tố nào đóng vai trò chủ yếu?", options: ["Niềm tin.", "Tri thức.", "Tình cảm.", "Lễ giáo."], ans: 0 },
            { q: "Quan điểm duy vật về mặt thứ nhất trong vấn đề cơ bản của mọi triết học là", options: ["vật chất có trước, ý thức có sau, vật chất quyết định ý thức.", "vật chất và ý thức cùng xuất hiện đồng thời và có tác động qua lại ngang nhau.", "ý thức có trước, sinh ra và quyết định vật chất.", "không thể xác định giữa vật chất và ý thức cái nào có trước, cái nào có sau, cái nào quyết định cái nào."], ans: 0 },
            { q: "Nguồn gốc ra đời của chủ nghĩa duy vật là", options: ["từ thực tiễn và sự phát triển của khoa học.", "từ khi V.I.Lênin đưa ra định nghĩa vật chất.", "từ khi con người phát hiện ra cấu tạo của nguyên tử.", "từ thực tiễn và sự phát triển của tôn giáo trong lịch sử xã hội loài người."], ans: 0 },
            { q: "Nguồn gốc ra đời của chủ nghĩa duy tâm là", options: ["Sự tuyệt đối hóa vai trò của ý thức.", "Xem xét phiến diện, tuyệt đối hóa, thần thánh hóa một mặt, một đặc tính nào đó của quá trình nhận thức.", "Tuyệt đối hóa vai trò của lao động trí óc và của giai cấp thống trị.", "Bao gồm tất cả đáp án."], ans: 3 },
            { q: "“Tư duy lý luận của mỗi thời đại và ngay trong thời đại chúng ta đều là sản phẩm lịch sử của các thời đại khác nhau và được tiếp thu dưới những hình thức khác nhau”. Hãy xác định phán đoán trên thể hiện phương pháp tư duy nào?", options: ["Phương pháp tư duy biện chứng.", "Phương pháp tư duy siêu hình.", "Phương pháp tư duy trừu tượng hóa.", "Phương pháp tư duy logic – lịch sử."], ans: 0 },
            { q: "Nhà triết học nào quan niệm “mọi vật đều tồn tại và đồng thời lại không tồn tại, vì mọi vật đang trôi\"?", options: ["Heraclitus.", "Socrate.", "Plato.", "Pitago."], ans: 0 },
            { q: "Nguyên nhân chính dẫn đến những hạn chế của phép biện chứng thời cổ đại là", options: ["trình độ nhận thức của con người và khoa học tự nhiên chưa phát triển.", "nhận thức đối tượng ở trạng thái cô lập, tĩnh tại, tách rời với đối tượng khác.", "xem sự vận động mang tính chất thần bí.", "xem sự vận động là sự mô tả của con người."], ans: 0 },
            { q: "Theo triết học Mác - Lênin, sai lầm cơ bản của phép biện chứng trong triết học Cổ điển Đức là gì?", options: ["Xem sự vận động của thế giới là kết quả của sự vận động tinh thần.", "Xem xét biện chứng chỉ là nghệ thuật tranh luận, biện luận và chứng minh.", "Do ảnh hưởng của thế giới quan tôn giáo.", "Quan niệm thượng đế là người điều khiển mọi quá trình vận động và phát triển của thế giới."], ans: 0 },
            { q: "Trong những năm 30 - 40 của thế kỷ XIX, địa vị chính trị của giai cấp công nhân đã trở thành", options: ["lực lượng chính trị độc lập trong xã hội tư bản.", "lực lượng chủ yếu giữ tư liệu sản xuất của xã hội.", "một giai cấp bình đẳng với giai cấp tư bản.", "lực lượng sản xuất trong xã hội cũ."], ans: 0 },
            { q: "Nhân tố chính trị - xã hội quan trọng cho sự ra đời của Triết học Mác - Lênin là", options: ["thực tiễn cách mạng của giai cấp vô sản.", "cuộc cách mạng khoa học kỹ thuật lần thứ nhất.", "sự ra đời của một số ngành khoa học xã hội.", "phong trào đấu tranh giành độc lập ở các nước thuộc địa."], ans: 0 },
            { q: "C.Mác và Ph.Ăngghen đã kế thừa nội dung cơ bản gì trong triết học của Hegel?", options: ["Phép biện chứng.", "Chủ nghĩa duy tâm chủ quan.", "Phép siêu hình.", "Chủ nghĩa duy vật cổ đại."], ans: 0 },
            { q: "C.Mác và Ph.Ăngghen đã phê phán nội dung cơ bản gì trong triết học của Hegel?", options: ["Thế giới quan duy tâm.", "Phép biện chứng.", "Thế giới quan duy vật.", "Phép siêu hình."], ans: 0 },
            { q: "C.Mác và Ph.Ăngghen đã kế thừa nội dung cơ bản gì trong triết học của Feuerbach?", options: ["Thế giới quan duy vật.", "Thế giới quan duy tâm.", "Phép biện chứng.", "Phép siêu hình."], ans: 0 },
            { q: "Ý nghĩa của Định luật bảo toàn và chuyển hóa năng lượng; Học thuyết tế bào và Thuyết tiến hóa của Đácuyn đối với lý luận của chủ nghĩa Mác - Lênin là", options: ["vạch ra tính thống nhất vật chất của thế giới, tính biện chứng của sự vận động và phát triển của nó.", "chống lại thuyết sáng thế của Thiên Chúa giáo.", "vạch ra tính thống nhất vật chất của thế giới nhưng không chỉ ra tính biện chứng của sự vận động và phát triển của nó.", "chống lại thuyết Hoài nghi luận."], ans: 0 },
            { q: "Thời kỳ nào C.Mác và Ph.Ăngghen đề xuất những nguyên lý triết học duy vật biện chứng và duy vật lịch sử?", options: ["Thời kỳ 1844-1847.", "Thời kỳ 1848-1895.", "Thời kỳ 1841-1844.", "Thời kỳ 1820-1890."], ans: 0 },
            { q: "Phạm trù “Lao động tự tha hóa” được C.Mác đề cập lần đầu tiên trong tác phẩm nào?", options: ["Bản thảo kinh tế - triết học năm 1844.", "Bộ Tư bản.", "Gia đình thần thánh.", "Phác thảo góp phần phê phán kinh tế chính trị học."], ans: 0 },
            { q: "Tại sao nói Hệ tư tưởng Đức (1845 – 1846) là tác phẩm đầu tiên chứa đựng hoàn chỉnh những quan điểm triết học của C.Mác và Ph.Ăngghen?", options: ["Đã bao hàm những quan điểm duy vật biện chứng để giải thích về tự nhiên, xã hội và hoạt động nhận thức.", "Đã có những giải thích về phong trào công nhân quốc tế và sự phát triển nhanh chóng của chúng.", "Đã bắt đầu có sự tìm hiểu với toàn bộ triết học cổ điển Đức.", "Đã bắt đầu có sự phê phán đối với Hegel và Feuerbach."], ans: 0 },
            { q: "Thực chất cuộc cách mạng do C.Mác và Ph. Ăngghen thực hiện trong triết học là gì?", options: ["Giải thích hiện thực về mặt triết học với cuộc đấu tranh cải tạo hiện thực bởi thực tiễn cách mạng.", "Thống nhất quan niệm duy vật về tự nhiên với quan niệm duy vật về đời sống xã hội.", "Thống nhất giữa chủ nghĩa duy vật với phép biện chứng.", "Tất cả các đáp án đều đúng."], ans: 3 },
            { q: "Tác phẩm nào của V.I.Lênin đưa ra chủ trương phát triển kinh tế trong thời kỳ quá độ tiến lên xây dựng chủ nghĩa xã hội ở Nga?", options: ["Chính sách kinh tế mới.", "Sáng kiến vĩ đại.", "Những nhiệm vụ trước mắt của chính quyền Xô-viết.", "Chủ nghĩa đế quốc, giai đoạn tột cùng của chủ nghĩa tư bản."], ans: 0 },
            { q: "Triết học Mác - Lênin là gì?", options: ["Là hệ thống quan điểm duy vật biện chứng về tự nhiên, xã hội và tư duy, trở thành thế giới quan phương pháp luận khoa học, cách mạng của giai cấp công nhân và nhân dân lao động trong nhận thức và cải tạo thế giới.", "Là hệ thống quan điểm về tự nhiên, xã hội và tư duy; trở thành thế giới quan và phương pháp luận khoa học, cách mạng của các giai cấp trong xã hội.", "Là hệ thống quan điểm duy vật về tự nhiên, xã hội; trở thành thế giới quan và phương pháp luận khoa học, cách mạng của giai cấp công nhân và nhân dân lao động trong nhận thức.", "Là hệ thống quan điểm duy vật về tự nhiên, xã hội; trở thành thế giới quan và phương pháp luận khoa học, cách mạng của giai cấp công nhân."], ans: 0 },
            { q: "Vai trò đặc biệt quan trọng của thế giới quan duy vật biện chứng là định hướng", options: ["con người nhận thức đúng thế giới hiện thực.", "con người thay đổi thế giới.", "con người tác động thế giới thông qua hoạt động thực tiễn.", "con người hành động cải tạo thế giới."], ans: 3 },
            { q: "Tiền đề để xác lập nhân sinh quan tích cực là", options: ["Thế giới quan duy vật biện chứng.", "Thế giới quan duy tâm.", "Phương pháp biện chứng.", "Phương pháp siêu hình."], ans: 0 },
            { q: "Vai trò của phương pháp luận duy vật biện chứng là gì?", options: ["Phương pháp chung của toàn bộ nhận thức khoa học.", "Phương pháp toàn bộ của xã hội.", "Phương pháp thực hành của nhận thức.", "Phương pháp chung nhất của tư duy."], ans: 3 },
            { q: "Hạn chế của các quan niệm về phạm trù vật chất ở thời cổ đại là", options: ["có tính trực quan, ngây thơ, chất phác.", "có tính chất duy tâm chủ quan.", "có tính khoa học.", "có tính duy tâm khách quan."], ans: 0 },
            { q: "Theo quan điểm của Triết học Mác - Lênin, phương thức tồn tại của vật chất là", options: ["vận động, không gian, thời gian.", "không gian.", "ý thức.", "thời gian."], ans: 0 },
            { q: "Trường phái triết học nào quan niệm nguồn gốc của ý thức là “óc tiết ra ý thức như gan tiết ra mật”?", options: ["Chủ nghĩa duy vật tầm thường thế kỷ XVIII.", "Chủ nghĩa duy tâm khách quan.", "Chủ nghĩa duy tâm chủ quan.", "Chủ nghĩa duy vật siêu hình thế kỷ XV - XVIII."], ans: 0 },
            { q: "Theo chủ nghĩa duy vật biện chứng, điều kiện cần và đủ cho sự ra đời của ý thức là", options: ["nguồn gốc tự nhiên và xã hội.", "bộ não con người và thế giới bên ngoài tác động vào bộ não.", "lao động và ngôn ngữ.", "hoạt động thực tiễn của con người."], ans: 0 },
            { q: "Vai trò của lao động và ngôn ngữ đối với sự hình thành và phát triển của ý thức là gì?", options: ["Làm chuyển biến dần bộ óc của loài vượn người thành bộ óc con người và tâm lý động vật thành ý thức con người.", "Làm chuyển biến bộ máy phát âm, trung tâm ngôn ngữ trong bộ óc con người được hình thành và phát triển.", "Là nhu cầu giao tiếp, trao đổi thông tin giữa các thành viên trong xã hội.", "Là khả năng con người sản xuất ra của cải vật chất và tinh thần."], ans: 0 },
            { q: "Sự phản ánh gì có tính chủ động lựa chọn thông tin, xử lý thông tin để tạo ra những thông tin mới, phát hiện ý nghĩa của thông tin?", options: ["Ý thức.", "Khoa học.", "Ý chí.", "Tri thức."], ans: 0 },
            { q: "Điểm khác biệt giữa hình thức phản ánh ý thức và các hình thức phản ánh khác của thế giới vật chất là", options: ["phản ánh có sự tích cực, sáng tạo.", "phản ánh mang tính thụ động.", "phản ánh có tính hợp lý.", "phản ánh có tính định hướng, lựa chọn."], ans: 0 },
            { q: "Chọn quan điểm đúng theo Triết học Mác - Lênin?", options: ["Tình cảm phản ánh quan hệ giữa người với người và quan hệ giữa người với thế giới khách quan.", "Tình cảm là yếu tố quyết định trong kết cấu của ý thức.", "Tình cảm là sự cản trở không cho ý thức con người quyết đoán tiễn.", "Tình cảm không có ý nghĩa đối với hoạt động khoa học."], ans: 0 },
            { q: "Theo quan điểm của chủ nghĩa duy tâm, vai trò của vật chất đối với ý thức là gì?", options: ["Ý thức là tồn tại duy nhất, tuyệt đối, là tính thứ nhất từ đó sinh ra tất cả.", "Khẳng định một chiều vai trò của vật chất sinh ra ý thức, quyết định ý thức, phủ nhận tính độc lập tương đối của ý thức.", "Ý thức có thể tác động trở lại vật chất thông qua hoạt động thực tiễn của con người.", "Vật chất quyết định ý thức, ý thức có tính độc lập tương đối và tác động trở lại vật chất."], ans: 0 },
            { q: "Đặc điểm của phép biện chứng duy vật là", options: ["sự thống nhất hữu cơ giữa thế giới quan duy vật và phương pháp luận biện chứng.", "sự thống nhất giữa lý luận nhận thức và logic hình thức.", "sự thống nhất, phủ định các nguyên lý, quy luật, phạm trù của phép biện chứng.", "Tất cả các đáp án đều đúng."], ans: 0 },
            { q: "Tính khoa học và cách mạng rõ nét nhất của phép biện chứng duy vật Mác - Lênin thể hiện như thế nào?", options: ["Không dừng lại ở sự giải thích thế giới mà còn là công cụ để nhận thức và cải tạo thế giới.", "Chứng minh được nguồn gốc và động lực của mọi sự phát triển của xã hội.", "Là công cụ khoa học nhất để nhận thức thế giới.", "Xác định triết học là khoa học của mọi khoa học."], ans: 0 },
            { q: "Theo Triết học Mác - Lênin, khái niệm nào được coi là trạng thái của các đối tượng khi sự thay đổi của đối tượng này không ảnh hưởng đến đối tượng khác, không làm chúng thay đổi?", options: ["Cô lập.", "Liên hệ.", "Tác động.", "Mối liên hệ."], ans: 0 },
            { q: "Quan điểm siêu hình về mối liên hệ giữa các sự vật hiện tượng trong thế giới khách quan là", options: ["các sự vật, hiện tượng tồn tại tách rời nhau, cái này bên cạnh cái kia, hết cái này đến cái kia, giữa chúng không có mối quan hệ ràng buộc quy định và chuyển hóa lẫn nhau, hoặc nếu có thì chỉ có mối liên hệ có tính ngẫu nhiên, bên ngoài.", "sự quy định, sự tác động và sự chuyển hóa lẫn nhau giữa các sự vật hiện tượng, hay giữa các mặt của một sự vật một hiện tượng trong thế giới khách quan.", "cơ sở của sự liên hệ, tác động qua lại giữa các sự vật hiện tượng là thượng đế.", "các sự vật hiện tượng có mối liên hệ qua lại với nhau trong thế giới khách quan."], ans: 0 },
            { q: "Chúng ta cần quán triệt nguyên tắc nào trong việc tìm hiểu nguyên lý về mối liên hệ phổ biến của Triết học Mác - Lênin?", options: ["Nguyên tắc toàn diện.", "Nguyên tắc toàn diện và quan điểm thực tiễn.", "Nguyên tắc phát triển.", "Nguyên tắc lịch sử - cụ thể."], ans: 0 },
            { q: "Phạm trù nào dùng để chỉ hình thức hoạt động trí óc phổ biến của con người, là những mô hình tư tưởng phản ánh những thuộc tính và mối liên hệ vốn có ở tất cả các đối tượng hiện thực?", options: ["Phạm trù triết học.", "Phạm trù chính trị học.", "Phạm trù kinh tế chính trị học.", "Phạm trù chủ nghĩa xã hội khoa học."], ans: 0 },
            { q: "Quan điểm của các nhà triết học duy thực về mối quan hệ giữa cái chung và cái riêng là", options: ["cái chung tồn tại độc lập không phụ thuộc vào cái riêng.", "cái chung là bộ phận của cái riêng, phụ thuộc vào cái riêng để tồn tại.", "cái chung không tồn tại, chỉ là tên gọi, xưng danh của các đối tượng riêng lẻ.", "cái chung là cái toàn bộ, sâu sắc hơn cái riêng."], ans: 0 },
            { q: "Theo quan điểm duy vật biện chứng, mối quan hệ giữa cái chung và cái riêng là", options: ["không có cái chung thuần túy, tồn tại bên ngoài cái riêng.", "cái chung tồn tại khách quan, bên ngoài cái riêng.", "cái riêng tồn tại khách quan không bao hàm cái chung.", "cái chung tồn tại khách quan, bên ngoài cái riêng; có cái chung tồn tại bên ngoài cái riêng."], ans: 0 },
            { q: "Theo quan điểm Triết học Mác - Lênin, luận điểm nào sau đây sai?", options: ["Cái chung không phụ thuộc vào cái riêng và sinh ra cái riêng.", "Cái riêng là chỉ một sự vật, hiện tượng, quá trình riêng lẻ nhất định.", "Cái đơn nhất chỉ một yếu tố (thuộc tính) chỉ có ở một sự vật, hiện tượng, quá trình, được lập lại bất kỳ một sự vật (hiện tượng, quá trình).", "Cái chung chỉ là một yếu tố (thuộc tính) không chỉ có ở một sự vật (hiện tượng, quá trình) này mà còn được lặp lại trong nhiều sự vật (hiện tượng, quá trình) khác nhau."], ans: 0 },
            { q: "Theo quan điểm duy vật biện chứng nguyên nhân, nguyên cớ và điều kiện có quan hệ như thế nào?", options: ["Khác nhau nhưng có mối liên hệ với nhau.", "Hoàn toàn giống nhau.", "Tồn tại độc lập với nhau.", "Nguyên nhân, nguyên cớ sinh ra điều kiện."], ans: 0 },
            { q: "Theo phép biện chứng duy vật, phạm trù hình thức là", options: ["dùng để chỉ phương thức tồn tại và phát triển của sự vật, hiện tượng; hệ thống các mối quan hệ cấu thành nên nội dung sự vật, hiện tượng và là cái biểu hiện cả bên trong và bên ngoài của sự vật, hiện tượng.", "dùng để chỉ bề ngoài của những sự vật hiện tượng như đường nét, màu sắc, kích thước.", "dùng để chỉ tính quy định khách quan vốn có, là sự thống nhất hữu cơ của các thuộc tính.", "sự biến đổi các thuộc tính bên ngoài của sự vật, hiện tượng."], ans: 0 },
            { q: "Theo phép biện chứng duy vật, phạm trù khả năng là", options: ["tổng thể các tiền đề của sự biến đổi, sự hình thành của hiện thực mới, là cái có thể có, nhưng ngay lúc này còn chưa có.", "mọi tiền đề của sự biến đổi, sự hình thành của hiện thực mới của sự vật.", "cái có thể có, nhưng ngay lúc này còn chưa có.", "Tất cả sự biến đổi, sự hình thành của hiện thực mới của sự vật."], ans: 0 },
            { q: "Theo phép biện chứng duy vật, hiểu một cách đơn giản phạm trù hiện thực là gì?", options: ["Các hiện tượng thể hiện bản chất đó.", "Cái đang có, đang tồn tại, gồm tất cả các sự vật, hiện tượng tồn tại khách quan trong thực tế.", "Các hiện tượng chủ quan đang tồn tại trong ý thức, là sự thống nhất biện chứng của bản chất.", "Bao gồm tất cả các đáp án."], ans: 3 },
            { q: "Hoạt động nào của con người làm thay đổi hiện thực khách quan, thông qua thực hiện các khả năng nhất định bằng cách tạo ra những điều kiện tương ứng?", options: ["Hoạt động thực tiễn.", "Hoạt động khoa học.", "Hoạt động vật chất.", "Hoạt động tinh thần."], ans: 0 },
            { q: "Một trong những ý nghĩa phương pháp luận được rút ra từ việc nghiên cứu cặp phạm trù khả năng và hiện thực là gì?", options: ["Trong hoạt động nhận thức và hoạt động thực tiễn phải lựa chọn khả năng trong số hiện có, trước hết phải chú ý đến khả năng gần, khả năng tất nhiên vì chúng dễ chuyển hóa thành hiện thực hơn.", "Trong hoạt động nhận thức và hoạt động thực tiễn chú ý tuyệt đối vai trò của nhân tố khách quan trong quá trình biến đổi khả năng thành hiện thực.", "Trong hoạt động nhận thức và hoạt động thực tiễn cần lựa chọn khả năng phù hợp của nhân tố khách quan trong quá trình biến đổi khả năng thành hiện thực.", "Trong hoạt động nhận thức và hoạt động thực tiễn cần xem xét các khả năng khác nhau trong quá trình biến đổi khả năng thành hiện thực."], ans: 0 },
            { q: "Chọn đáp án đúng về “Chất” của sự vật.", options: ["Mỗi sự vật có nhiều chất, thậm chí vô số chất.", "Mỗi sự vật chỉ có một chất.", "Mọi sự biến đổi về lượng đều dẫn đến những biến đổi về chất.", "Mọi sự thay đổi đều có thể được coi là bước nhảy về chất."], ans: 0 },
            { q: "Dân gian có câu “Năng nhặt, chặt bị”, thể hiện quan niệm nào sau đây?", options: ["Phải chú ý tới lượng để chuyển thành chất.", "Chỉ cần chú ý tới lượng.", "Phải chú ý tới chất.", "Chỉ cần chú ý tới độ."], ans: 0 },
            { q: "Chọn đáp án sai. Ý nghĩa phương pháp luận được rút ra trong quy luật chuyển hóa từ những thay đổi về lượng dẫn đến những thay đổi về chất và ngược lại.", options: ["không cần tích luỹ về lượng mà có thể thay đổi luôn chất của sự vật.", "thay đổi chất của sự vật trên cơ sở tích luỹ về lượng.", "phải kiên quyết thực hiện bước nhảy khi đã tới điểm nút.", "phải chống tư tưởng rụt rè, bảo thủ,"], ans: 0 },
            { q: "Căn cứ để chỉ ra mâu thuẫn đối kháng và mâu thuẫn không đối kháng trong sự tồn tại và phát triển của sự vật, hiện tượng là", options: ["tính chất của lợi ích cơ bản là đối lập nhau trong mối quan hệ giữa các giai cấp ở một giai đoạn lịch sử nhất định trong xã hội.", "vai trò của mâu thuẫn đối với sự tồn tại phát triển của sự vật, hiện tượng.", "mối quan hệ của các mặt đối lập trong mỗi sự vật, hiện tượng.", "toàn bộ sự tồn tại và phát triển của sự vật, hiện tượng."], ans: 0 },
            { q: "Theo phép biện chứng duy vật, mối liên hệ giữa thống nhất và đấu tranh giữa các mặt đối lập là", options: ["sự thống nhất và đấu tranh giữa các mặt đối lập này là nguyên nhân, động lực bên trong của sự vận động và phát triển, làm cho cái cũ mất đi và cái mới ra đời.", "không có “sự đấu tranh của các mặt đối lập” thì vẫn có “sự thống nhất của các mặt đối lập”.", "không có “sự thống nhất của các mặt đối lập” thì vẫn có “sự đấu tranh của các mặt đối lập”.", "sự đấu tranh của các mặt đối lập vừa tương đối, vừa tuyệt đối."], ans: 0 },
            { q: "Một trong những ý nghĩa phương pháp luận của việc tìm hiểu quy luật thống nhất và đấu tranh giữa các mặt đối lập là", options: ["muốn phát hiện mâu thuẫn cần tìm ra thể thống nhất của các mặt đối lập trong sự vật, hiện tượng; từ đó tìm ra phương hướng, giải pháp đúng cho hoạt động nhận thức và thực tiễn.", "muốn tìm ra phương hướng, giải pháp cho hoạt động thực tiễn, không thừa nhận tỉnh khách quan của mâu thuẫn, phát hiện mâu thuẫn và cần tìm ra sự khác nhau trong sự vật, hiện tượng.", "muốn tìm ra phương hướng, giải pháp cho hoạt động nhận thức, không thừa nhận tính khách quan của mâu thuẫn, cần tìm ra sự khác nhau trong sự vật, hiện tượng.", "Muốn tìm ra phương hướng, giải pháp cho hoạt động nhận thức, thừa nhận tính chủ quan của mâu thuẫn."], ans: 0 },
            { q: "Quy luật nào chỉ ra khuynh hướng (đi lên), hình thức (xoáy ốc), kết quả (sự vật, hiện tượng mới ra đời từ sự vật, hiện tượng cũ) của sự phát triển của chúng thông qua sự thống nhất giữa tính thay đổi với tính kế thừa trong sự phát triển?", options: ["Quy luật phủ định của phủ định", "Quy luật về sự phù hợp của quan hệ sản xuất với tính chất và trình độ của lực lượng sản xuất", "Quy luật chuyển hoá từ sự thay đổi về lượng dẫn đến sự thay đổi về chất và ngược lại", "Quy luật thống nhất và đấu tranh của các mặt đối lập"], ans: 0 },
            { q: "Theo phép biện chứng duy vật, đặc điểm cơ bản của phủ định biện chứng là gì?", options: ["Sau một số (ít nhất là hai) lần phủ định, sự vật, hiện tượng phát triển có tính chu kỳ theo đường xoáy ốc, trong đó giai đoạn sau vẫn bảo tồn những gì tích cực đã được tạo ra ở giai đoạn trước.", "Sau nhiều lần phủ định, sự vật, hiện tượng phát triển có tính chu kỳ theo đường xoáy ốc mà thực chất của sự phát triển đó là sự biến đổi.", "Sau vô số lần phủ định sự vật, hiện tượng phát triển, biến đổi cao hơn giai đoạn trước.", "Sau quá trình phủ định, sự vật, hiện tượng phát triển qua nhiều giai đoạn, trong đó giai đoạn sau vẫn bảo tồn những yếu tố đã được tạo ra ở giai đoạn trước."], ans: 0 },

            { q: "Mối quan hệ giữa lĩnh vực kinh tế và lĩnh vực chính trị của xã hội được khái quát trong quy luật nào?", options: ["Quy luật về mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng.", "Quy luật về mối quan hệ ngẫu nhiên, không phù hợp giữa cơ sở hạ tầng và kiến trúc thượng tầng.", "Quy luật về mối quan hệ chủ quan giữa cơ sở hạ tầng và kiến trúc thượng tầng.", "Quy luật về mối quan hệ tự phát giữa cơ sở hạ tầng và kiến trúc thượng tầng."], ans: 0 },
            { q: "Vai trò của kiến trúc thượng tầng là", options: ["vai trò bảo vệ duy trì, củng cố lợi ích của giai cấp thống trị xã hội.", "vai trò tích cực, tự giác của ý thức, tư tưởng.", "sức mạnh vật chất của bộ máy tổ chức – thể chế.", "Bao gồm tất cả các đáp án."], ans: 0 },
            { q: "Đặc trưng của kiến trúc thượng tầng xã hội chủ nghĩa là", options: ["sự nhất trí về chính trị và tinh thần trong toàn xã hội.", "sự nhất trí về tư tưởng chính trị và kinh tế.", "sự nhất trí về kinh tế và văn hóa.", "sự nhất trí về khoa học và giáo dục."], ans: 0 },
            { q: "Điền vào chỗ trống để hoàn thiện định nghĩa giai cấp của V.L.Lênin: “Giai cấp là những tập đoàn người, mà một tập đoàn có thể... của các tập đoàn khác, do địa vị khác nhau của họ trong một chế độ kinh tế xã hội nhất định\"", options: ["Chiếm đoạt lao động.", "Chiếm đoạt của cải.", "Chiếm đoạt tư liệu sản xuất.", "Chiếm đoạt tài sản."], ans: 0 },
            { q: "Theo Triết học Mác - Lênin, sự khác biệt cơ bản nhất giữa các giai cấp là", options: ["quyền sở hữu tư liệu sản xuất.", "quyền tổ chức quản lý.", "quyền phân phối sản phẩm.", "quyền tham gia quản lý xã hội."], ans: 0 },
            { q: "Một giai cấp chỉ thực sự thực hiện quyền thống trị của nó đối với toàn xã hội khi nào?", options: ["Nắm được tư liệu sản xuất chủ yếu và quyền lực nhà nước.", "Nắm được tư liệu sản xuất và tổ chức sản xuất.", "Nắm được giai cấp tiến bộ và thành tựu khoa học.", "Nắm được quyền lực nhà nước và thành tựu khoa học."], ans: 0 },
            { q: "Để xóa bỏ giai cấp trước hết phải xóa bỏ chế độ gì?", options: ["Chế độ tư hữu.", "Chế độ người bóc lột người.", "Chế độ tư bản chủ nghĩa.", "Chế độ xã hội có phân chia thành đẳng cấp."], ans: 0 },
            { q: "Theo C.Mác, “sợi dây xuyên suốt toàn bộ lịch sử nhân loại” là gi?", options: ["Đấu tranh giai cấp.", "Lực lượng sản xuất.", "Quan hệ sản xuất.", "Cơ sở hạ tầng."], ans: 0 },

            { q: "Theo Triết học Mác - Lênin, cuộc đấu tranh của giai cấp vô sản chia thành mấy giai đoạn cơ bản?", options: ["Hai giai đoạn cơ bản.", "Ba giai đoạn cơ bản.", "Bốn giai đoạn cơ bản.", "Năm giai đoạn cơ bản."], ans: 0 },
            { q: "Đặc trưng cơ bản nhất của dân tộc là:", options: ["ngôn ngữ.", "lao động.", "thống nhất về kinh tế.", "sống trên vùng lãnh thổ nhất định."], ans: 0 },
            { q: "Sự xuất hiện chế độ tư hữu; sự bất bình đẳng, sự phân hóa giai cấp diễn ra phổ biến; xuất hiện giai cấp thống trị và giai cấp bị thống trị, bắt đầu vào giai đoạn nào?", options: ["Cuối của xã hội cộng sản nguyên thủy.", "Cuối của xã hội chiếm hữu nô lệ.", "Cuối của xã hội phong kiến.", "Cuối của xã hội tư bản chủ nghĩa."], ans: 0 },
            { q: "Theo Triết học Mác - Lênin, cuộc đấu tranh giai cấp đầu tiên mang tính quyết liệt thời cổ đại dẫn đến sự ra đời của nhà nước là", options: ["giai cấp nô lệ và giai cấp chủ nô.", "giai cấp địa chủ và giai cấp nông dân.", "giai cấp tư sản và giai cấp vô sản.", "Tất cả các đáp án đều đúng."], ans: 0 }
        ];

        let correctScore = 0;
        let wrongScore = 0;
        const answeredQuestions = new Set();

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            // Dùng hàm escape để tránh lỗi hiển thị các thẻ HTML trong câu hỏi/đáp án
            const escape = (text) => text.replace(/</g, "&lt;").replace(/>/g, "&gt;");

            container.innerHTML = QUESTIONS.map((q, qIdx) => `
                <div class="bg-white rounded-[2rem] p-8 shadow-xl border border-gray-100 transition-all hover:border-blue-200">
                    <div class="flex gap-5 mb-8">
                        <span class="flex-shrink-0 w-12 h-12 bg-blue-600 text-white rounded-2xl flex items-center justify-center font-black text-xl italic shadow-lg transform -rotate-6">
                            ${qIdx + 1}
                        </span>
                        <h4 class="text-xl font-bold text-gray-800 pt-1 leading-snug">${escape(q.q)}</h4>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:pl-16">
                        ${q.options.map((opt, optIdx) => `
                            <button 
                                id="btn-${qIdx}-${optIdx}" 
                                onclick="checkAnswer(${qIdx}, ${optIdx})"
                                class="quiz-option group p-5 rounded-2xl bg-slate-50 border-2 border-transparent text-left flex items-center gap-4 w-full"
                            >
                                <span class="opt-letter w-10 h-10 flex-shrink-0 rounded-xl bg-white border-2 border-gray-100 flex items-center justify-center font-bold text-gray-400 group-hover:border-blue-300 transition-colors shadow-sm">
                                    ${String.fromCharCode(65 + optIdx)}
                                </span>
                                <span class="option-text text-[15px] font-semibold text-gray-600 group-hover:text-blue-700">${escape(opt)}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedback-${qIdx}" class="mt-6 ml-16 hidden font-bold text-sm italic"></div>
                </div>
            `).join('');
        }

        function checkAnswer(qIdx, selectedIdx) {
            if (answeredQuestions.has(qIdx)) return;
            answeredQuestions.add(qIdx);

            const correctIdx = QUESTIONS[qIdx].ans;
            const selectedBtn = document.getElementById(`btn-${qIdx}-${selectedIdx}`);
            const correctBtn = document.getElementById(`btn-${qIdx}-${correctIdx}`);
            const feedback = document.getElementById(`feedback-${qIdx}`);

            feedback.classList.remove('hidden');

            if (selectedIdx === correctIdx) {
                selectedBtn.classList.add('correct');
                correctScore++;
                document.getElementById('correct-count').innerText = correctScore;
                feedback.innerText = "✓ Chính xác!";
                feedback.className = "mt-6 ml-16 font-bold text-green-600 italic";
            } else {
                selectedBtn.classList.add('wrong');
                correctBtn.classList.add('correct');
                wrongScore++;
                document.getElementById('wrong-count').innerText = wrongScore;
                feedback.innerText = "✗ Sai rồi! Đáp án đúng là " + String.fromCharCode(65 + correctIdx);
                feedback.className = "mt-6 ml-16 font-bold text-red-600 italic";
            }

            QUESTIONS[qIdx].options.forEach((_, i) => {
                const btn = document.getElementById(`btn-${qIdx}-${i}`);
                if (i !== selectedIdx && i !== correctIdx) {
                    btn.style.opacity = "0.5";
                }
                btn.style.cursor = "default";
            });
        }

        window.onload = renderQuiz;
    </script>
